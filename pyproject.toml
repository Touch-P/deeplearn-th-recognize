[project]
name = "deeplearn-th-recognize"
version = "0.1.0"
description = "CNN + Transfer Learning + Data Augmentation for 72-class Thai character/digit recognition (class-imbalanced dataset)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "tensorflow==2.15.0",
    "tensorflow-intel==2.15.0; sys_platform == 'win32'",
    "tensorflow-io-gcs-filesystem<0.32; sys_platform == 'win32'",
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "pillow>=10.0",
    "scipy>=1.11",
    "tqdm>=4.66",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    # PyTorch track (torch_pipeline/): ResNet50 transfer learning with
    # error-driven balanced augmentation. CUDA build so the RTX 3050 is used.
    "torch>=2.5,<2.8",
    "torchvision>=0.20,<0.23",
]

[tool.uv]
package = false

# The PyPI torch wheels for Windows are CPU-only, so CUDA builds come from
# PyTorch's own index. `explicit = true` keeps every other package on PyPI.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
